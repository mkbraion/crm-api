# Deploy no Render (grátis, sem cartão). Provisiona Postgres e sobe a API.
databases:
  - name: crm-db
    plan: free
    databaseName: crm
    user: crm

services:
  - type: web
    name: crm-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_VERSION
        value: "20"
